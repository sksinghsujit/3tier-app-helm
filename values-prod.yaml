global:
  namespace: "app-prod"
# Database Configuration
postgresql:
  enabled: true
  name: postgres
  image: registry.redhat.io/rhel9/postgresql-15:latest
  database: appdb
  username: appuser
  password: "SuperSecretPassword123!" # In production, pull from Vault or SealedSecret
  storageSize: 5Gi
  port: 5432
  storageClassName: ocs-storagecluster-ceph-rbd
# Backend API Configuration
backend:
  name: backend-api
  replicas: 2
  port: 8080
  image:
    repository: "image-registry.openshift-image-registry.svc:5000/app-prod/backend-api"
    tag: "9f58e7ce09fd193dece76536c32b1cbf4c071a12"
  git:
    uri: "https://github.com/sksinghsujit/3tier-app-backend-service.git" # Replace with your git repo
    ref: "main"
    contextDir: "/"
  env:
    DB_HOST: "postgres"
    DB_PORT: "5432"
    DB_NAME: "appdb"
    DB_USER: "appuser"
# Frontend Web App Configuration
frontend:
  name: frontend-web
  replicas: 2
  port: 8080
  image:
    repository: "image-registry.openshift-image-registry.svc:5000/app-prod/frontend-api"
    tag: "latest"
  git:
    uri: "https://github.com/your-org/frontend-repo.git" # Replace with your git repo
    ref: "main"
    contextDir: "/"
  route:
    enabled: true
    host: "app-prod.apps.c1.ucmc.org" # Replace with your cluster domain
    tls:
      termination: edge
frontend:
  name: frontend-web
  replicas: 2
  port: 8080
  image:
    repository: "image-registry.openshift-image-registry.svc:5000/app-prod/frontend-web"
    tag: "eacba3477ea80862ad66e2b6cafcb69fb3d344b9"
  git:
    uri: "https://github.com/sksinghsujit/3tier-app-frontend-service.git" # Replace with your git repo
    ref: "main"
    contextDir: "/"
  route:
    enabled: true
    host: "app-prod.apps.c1.ucmc.org" # Replace with your cluster domain
    tls:
      termination: edge
